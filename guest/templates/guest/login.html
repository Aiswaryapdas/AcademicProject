<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Academic Portal Login</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
      }

      /* BACKGROUND */

      body {
        height: 100vh;
        background: linear-gradient(135deg, #1e3a5f, #2d6cdf);
        display: flex;
        flex-direction: column;
      }

      /* NAVBAR */

      .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 18px 60px;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
      }

      .logo {
        color: white;
        font-size: 22px;
        font-weight: bold;
      }

      .nav-links a {
        color: white;
        text-decoration: none;
        margin-left: 25px;
        font-weight: 500;
      }

      .nav-links a:hover {
        color: #ffd700;
      }

      /* MAIN AREA */

      .main-container {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* LOGIN CARD */

      .login-container {
        background: rgba(255, 255, 255, 0.95);
        padding: 45px;
        width: 380px;
        border-radius: 15px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);

        animation: fadeIn 1s;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .login-container h2 {
        text-align: center;
        margin-bottom: 30px;
        color: #1e3a5f;
      }

      /* INPUT GROUP */

      .input-group {
        position: relative;
        margin-bottom: 20px;
      }

      .input-group i {
        position: absolute;
        top: 12px;
        left: 12px;
        color: #888;
      }

      .input-group input {
        width: 100%;
        padding: 10px 10px 10px 35px;
        border-radius: 6px;
        border: 1px solid #ccc;
        font-size: 14px;
      }

      /* BUTTON */

      button {
        width: 100%;
        padding: 12px;
        background: #1e3a5f;
        border: none;
        color: white;
        font-size: 16px;
        border-radius: 6px;
        cursor: pointer;
        transition: 0.3s;
      }

      button:hover {
        background: #16304d;
        transform: scale(1.03);
      }

      /* ERROR */

      .error-msg {
        color: red;
        text-align: center;
        margin-bottom: 15px;
      }

      /* FOOTER */

      .footer {
        text-align: center;
        color: white;
        padding: 15px;
        font-size: 14px;
      }
    </style>
  </head>

  <body>
    <!-- NAVBAR -->

    <div class="navbar">
      <div class="logo">🎓 EduTrack</div>

      <div class="nav-links">
        <a href="/">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
        <a href="#">Sign In</a>
      </div>
    </div>

    <!-- LOGIN -->

    <div class="main-container">
      <div class="login-container">
        <h2>Portal Login</h2>

        {% if msg %}
        <div class="error-msg">{{ msg }}</div>
        {% endif %}

        <form method="POST">
          {% csrf_token %}

          <div class="input-group">
            <i class="fa fa-envelope"></i>
            <input
              type="email"
              name="txt_email"
              id="txt_email"
              placeholder="Enter your email"
              required
            />
          </div>

          <div class="input-group">
            <i class="fa fa-lock"></i>
            <input
              type="password"
              name="txt_pass"
              id="txt_pass"
              placeholder="Enter your password"
              required
            />
          </div>

          <button type="submit"><i class="fa fa-sign-in-alt"></i> Login</button>
        </form>
      </div>
    </div>

    <div class="footer">© Academic Project Management System</div>
  </body>
</html>
