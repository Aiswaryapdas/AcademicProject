<h2>Document Marks</h2>

<table border="1" cellpadding="10">
  <tr>
    <th>Document Title</th>
    <th>Submitted At</th>
    <th>Mark</th>
  </tr>

  {% for sub in submissions %}

  <tr>
    <td>{{ sub.schedule.title }}</td>

    <td>{{ sub.submitted_at }}</td>

    <td>
      {% if sub.faculty_mark %} {{ sub.faculty_mark }} / 10 {% else %}
      <span style="color: orange">Not Evaluated Yet</span>
      {% endif %}
    </td>
  </tr>

  {% endfor %}
</table>
