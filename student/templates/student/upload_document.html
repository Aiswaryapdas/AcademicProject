<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload Document | MBITS</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <style>
      :root {
        --et-dark: #2c3e50;
        --et-sidebar: #34495e;
        --et-bg: #f4f7f9;
        --et-accent: #3498db;
        --et-border: #dcdde1;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background: var(--et-bg);
        display: flex;
        min-height: 100vh;
      }

      /* SIDEBAR */
      .sidebar {
        width: 240px;
        background: var(--et-dark);
        color: white;
        flex-shrink: 0;
      }

      .sidebar-brand {
        padding: 15px 20px;
        background: #1a252f;
        font-size: 1.2rem;
        font-weight: bold;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .nav-item {
        padding: 12px 20px;
        display: flex;
        align-items: center;
        gap: 12px;
        color: #bdc3c7;
        text-decoration: none;
        border-bottom: 1px solid #3e4f5f;
        font-size: 0.9rem;
      }

      .nav-item.active {
        background: var(--et-sidebar);
        color: white;
        border-left: 4px solid var(--et-accent);
      }

      /* MAIN LAYOUT */
      .main-wrapper {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
      }

      .top-header {
        background: #fff;
        height: 50px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 25px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        border-bottom: 1px solid #eee;
      }

      .breadcrumb {
        background: #fff;
        padding: 12px 25px;
        border-bottom: 1px solid #ddd;
        font-size: 0.85rem;
        color: #7f8c8d;
      }

      .content-area {
        padding: 25px;
      }

      .card {
        background: white;
        border: 1px solid var(--et-border);
        border-radius: 4px;
        overflow: hidden;
      }

      .card-header {
        background: #f8f9fa;
        padding: 12px 20px;
        border-bottom: 1px solid var(--et-border);
        font-weight: bold;
      }

      .card-body {
        padding: 30px;
      }

      .instruction-box {
        background: #fff9e6;
        border-left: 4px solid #f1c40f;
        padding: 15px;
        margin-bottom: 25px;
      }

      .btn-etlab {
        background: var(--et-dark);
        color: white;
        border: none;
        padding: 12px 25px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
    </style>
  </head>

  <body>
    <div class="sidebar">
      <div class="sidebar-brand">
        <i class="fa-solid fa-cloud"></i> EduTrack
      </div>
      <a href="#" class="nav-item"
        ><i class="fa-solid fa-gauge"></i> Dashboard</a
      >
      <a href="#" class="nav-item active"
        ><i class="fa-solid fa-file-invoice"></i> Assignments</a
      >
    </div>

    <div class="main-wrapper">
      <div class="top-header">
        <div style="font-size: 0.9rem; font-weight: 600; color: #555">
          PROJECT Portal
        </div>
        <div style="font-size: 0.85rem">
          <i class="fa-solid fa-user"></i> AISWARYA P DAS
        </div>
      </div>

      <div class="breadcrumb">
        Home
        <i
          class="fa-solid fa-chevron-right"
          style="font-size: 0.7rem; margin: 0 5px"
        ></i>
        Upload
      </div>

      <div class="content-area">
        <div class="card">
          <div class="card-header">
            <i class="fa-solid fa-file-upload"></i> {{ schedule.title }}
          </div>
          <div class="card-body">
            <div class="instruction-box">
              <strong>Notice:</strong> {{ schedule.description }}
            </div>

            <form method="POST" enctype="multipart/form-data">
              {% csrf_token %}
              <p>
                <b>Current File:</b>
                {% if submission %}
                <a href="{{ submission.file.url }}"
                  >{{ submission.file.name }}</a
                >
                {% else %} None {% endif %}
              </p>

              <input
                type="file"
                name="file"
                required
                style="margin: 20px 0; display: block"
              />

              <button type="submit" class="btn-etlab">
                {% if submission %}
                <i class="fa-solid fa-rotate"></i> Replace Submission {% else %}
                <i class="fa-solid fa-upload"></i> Upload Document {% endif %}
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
