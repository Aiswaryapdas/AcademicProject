<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Change Password</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f6f9;
      }

      .container {
        width: 350px;
        margin: 80px auto;
        background: #fff;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
      }

      h2 {
        text-align: center;
        margin-bottom: 20px;
      }

      label {
        font-weight: bold;
      }

      input {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 5px;
      }

      input:focus {
        border-color: #007bff;
        outline: none;
      }

      button {
        width: 100%;
        padding: 10px;
        background: #007bff;
        color: #fff;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
      }

      button:hover {
        background: #0056b3;
      }

      .message {
        text-align: center;
        color: red;
        margin-top: 10px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>Change Password</h2>

      <form method="POST">
        {% csrf_token %}

        <label>Current Password</label>
        <input
          type="password"
          name="current_password"
          placeholder="Enter current password"
          required
        />

        <label>New Password</label>
        <input
          type="password"
          name="new_password"
          placeholder="Enter new password"
          required
        />

        <label>Confirm Password</label>
        <input
          type="password"
          name="confirm_password"
          placeholder="Confirm new password"
          required
        />

        <button type="submit">Update Password</button>
      </form>

      {% for message in messages %}
      <p class="message">{{ message }}</p>
      {% endfor %}
    </div>
  </body>
</html>
