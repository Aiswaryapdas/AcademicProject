<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Faculty Registration</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <style>
      body {
        font-family: "Segoe UI", Arial, sans-serif;
        background-color: #f4f6f8;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 60px 20px;
      }

      /* Form container */
      .form-container {
        width: 480px;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 12px 25px rgba(0, 0, 0, 0.12);
        padding: 40px 35px 50px 35px;
        position: relative;
      }

      /* Back button */
      .back-btn {
        position: absolute;
        top: 20px;
        left: 20px;
        text-decoration: none;
        color: #2563eb;
        font-weight: bold;
        font-size: 14px;
        display: flex;
        align-items: center;
        transition: 0.3s;
      }

      .back-btn i {
        margin-right: 6px;
        font-size: 14px;
      }

      .back-btn:hover {
        color: #1e40af;
      }

      /* Form heading */
      h2 {
        text-align: center;
        color: #1e3a5f;
        font-size: 24px;
        margin-bottom: 35px;
      }

      /* Form groups */
      .form-group {
        position: relative;
        margin-bottom: 20px;
      }

      .form-group i {
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        color: #2563eb;
        font-size: 16px;
      }

      input,
      select {
        width: 100%;
        padding: 12px 12px 12px 40px;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 14px;
        box-sizing: border-box;
      }

      input:focus,
      select:focus {
        border-color: #2563eb;
        outline: none;
      }

      /* Submit button */
      button {
        width: 100%;
        padding: 14px;
        margin-top: 10px;
        background: #2563eb;
        color: white;
        font-size: 16px;
        font-weight: bold;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.3s;
      }

      button:hover {
        background: #1e40af;
      }

      /* ✅ Popup styles */
      .popup-container {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .popup {
        background: #22c55e;
        color: white;
        padding: 14px 20px;
        border-radius: 8px;
        margin-bottom: 10px;
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
        animation: fadeInOut 4s forwards;
      }

      .popup.error {
        background: #ef4444;
      }

      @keyframes fadeInOut {
        0% {
          opacity: 0;
          transform: translateY(-20px);
        }
        10% {
          opacity: 1;
          transform: translateY(0);
        }
        90% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translateY(-20px);
        }
      }

      /* Responsive */
      @media (max-width: 500px) {
        .form-container {
          width: 90%;
          padding: 30px 20px 40px 20px;
        }
      }
    </style>
  </head>
  <script>
    const form = document.querySelector("form");
    const password = document.querySelector("input[name='password']");
    const confirmPassword = document.querySelector(
      "input[name='confirm_password']",
    );
    const errorMsg = document.getElementById("passwordError");

    form.addEventListener("submit", function (e) {
      if (password.value !== confirmPassword.value) {
        e.preventDefault(); // stop form

        errorMsg.style.display = "block"; // show error
        confirmPassword.style.borderColor = "red";
      } else {
        errorMsg.style.display = "none"; // hide error
        confirmPassword.style.borderColor = "#ccc";
      }
    });
  </script>
  <body>
    <!-- ✅ Popup Message -->
    {% if messages %}
    <div class="popup-container">
      {% for message in messages %}
      <div class="popup {{ message.tags }}">{{ message }}</div>
      {% endfor %}
    </div>
    {% endif %}

    <div class="form-container">
      <a href="{% url 'WAdmin:faculty_list' %}" class="back-btn">
        <i class="fa-solid fa-arrow-left"></i>Back
      </a>

      <h2>Faculty Registration</h2>

      <form method="POST">
        {% csrf_token %}

        <div class="form-group">
          <i class="fa-solid fa-id-badge"></i>
          <input
            type="text"
            name="faculty_id"
            placeholder="Faculty ID"
            required
          />
        </div>

        <div class="form-group">
          <i class="fa-solid fa-user"></i>
          <input
            type="text"
            name="name"
            placeholder="Full Name"
            pattern="[A-Za-z ]+"
            title="Only letters allowed"
            required
          />
        </div>

        <div class="form-group">
          <i class="fa-solid fa-envelope"></i>
          <input
            type="email"
            name="email"
            placeholder="Email"
            title="Enter a valid email address"
            required
          />
        </div>

        <div class="form-group">
          <i class="fa-solid fa-phone"></i>
          <input
            type="text"
            name="phone"
            placeholder="Phone Number"
            pattern="[0-9]{10}"
            title="Enter 10 digit phone number"
            required
          />
        </div>

        <div class="form-group">
          <i class="fa-solid fa-building-columns"></i>
          <select name="department" required>
            <option value="">Select Department</option>
            <option>Computer Science</option>
            <option>Electronics</option>
            <option>Mechanical</option>
            <option>Civil</option>
          </select>
        </div>

        <div class="form-group">
          <i class="fa-solid fa-chalkboard-user"></i>
          <select name="designation" required>
            <option value="">Select Designation</option>
            <option>Assistant Professor</option>
            <option>Associate Professor</option>
            <option>Professor</option>
            <option>HOD</option>
            <option>Lecturer</option>
          </select>
        </div>

        <div class="form-group">
          <i class="fa-solid fa-lock"></i>
          <input
            type="password"
            name="password"
            placeholder="Password"
            minlength="6"
            title="Minimum 6 characters required"
            required
          />
        </div>

        <div class="form-group">
          <i class="fa-solid fa-lock"></i>
          <input
            type="password"
            name="confirm_password"
            placeholder="Confirm Password"
            required
          />
          <small id="passwordError" style="color: red; display: none">
            Passwords do not match ❌
          </small>
        </div>

        <button type="submit">Register</button>
      </form>
    </div>
  </body>
</html>
