<!doctype html>
<html>
  <head>
    <title>Project Group List</title>
    <style>
      body {
        font-family: Arial;
        background: #f4f6f8;
      }

      table {
        width: 80%;
        margin: 50px auto;
        border-collapse: collapse;
        background: white;
      }

      th,
      td {
        border: 1px solid #ddd;
        padding: 12px;
        text-align: left;
      }

      th {
        background: #28a745;
        color: white;
      }

      h2 {
        text-align: center;
        margin-top: 30px;
      }
    </style>
  </head>

  <body>
    <h2>Project Group List</h2>
    <form method="GET" style="text-align: center; margin-top: 20px">
      <select name="faculty">
        <option value="">All Faculties</option>

        {% for f in faculties %}
        <option value="{{ f.id }}">{{ f.name }}</option>
        {% endfor %}
      </select>

      <button type="submit">Filter</button>
    </form>
    <table>
      <tr>
        <th>Project Group Name</th>
        <th>Faculty Guide</th>
        <th>Students</th>
      </tr>

      {% for group in groups %}
      <tr>
        <td>{{ group.group_name }}</td>

        <td>{{ group.faculty.name }}</td>

        <td>
          {% for student in group.students.all %} {{ student.name }}<br />
          {% empty %} No students assigned {% endfor %}
        </td>
      </tr>

      {% empty %}
      <tr>
        <td colspan="3" style="text-align: center">
          No project groups created
        </td>
      </tr>
      {% endfor %}
    </table>
  </body>
</html>
