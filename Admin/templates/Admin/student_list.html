<!doctype html>
<html>
  <head>
    <title>Student List</title>
    <style>
      body {
        font-family: Arial;
        background: #f4f6f8;
      }
      table {
        width: 80%;
        margin: 50px auto;
        border-collapse: collapse;
        background: white;
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 12px;
        text-align: left;
      }
      th {
        background: #28a745;
        color: white;
      }
      h2 {
        text-align: center;
        margin-top: 30px;
      }
    </style>
  </head>
  <body>
    <h2>Student List</h2>
    <form method="GET" style="text-align: center; margin-top: 20px">
      <input
        type="text"
        name="q"
        placeholder="Search by name or admission number"
      />
      <button type="submit">Search</button>
    </form>
    <table>
      <tr>
        <th>Admission number</th>
        <th>Name</th>
        <th>Email</th>
        <th>Course</th>
        <th>Action</th>
      </tr>
      {% for student in students %}
      <tr>
        <td>{{ student.admission_number }}</td>
        <td>{{ student.name }}</td>
        <td>{{ student.email }}</td>
        <td>{{ student.course }}</td>
        <td>
          |
          <a
            href="{% url 'WAdmin:delete_student' student.id %}"
            onclick="
              return confirm('Are you sure you want to delete this student?');
            "
          >
            Delete
          </a>
        </td>
      </tr>
      {% empty %}
      <tr>
        <td colspan="3" style="text-align: center">No students registered</td>
      </tr>
      {% endfor %}
    </table>
    <a href="{% url 'WAdmin:admin_dashboard' %}" class="back-btn">
      <i class="fa-solid fa-arrow-left"></i>Back
    </a>
  </body>
</html>
